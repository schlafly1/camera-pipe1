<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Search & Vehicle Re-ID</title>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #222635; --border: #2d3147;
  --accent: #4f6ef7; --accent-hover: #6a83f9; --text: #e2e4ef; --muted: #8890a8;
  --person: #3aaa6e; --car: #e07b3a; --motorcycle: #9b6de0; --bicycle: #4fb3d9;
  --unfam: #f59e0b; --fam: #10b981; --danger: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; padding: 20px 24px; }

/* Header & Top Nav */
.top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 1.38rem; color: #fff; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.nav-tabs { display: flex; gap: 8px; background: var(--surface); padding: 5px; border-radius: 10px; border: 1px solid var(--border); }
.nav-tab {
  background: transparent; color: var(--muted); border: none; border-radius: 7px;
  padding: 8px 16px; font-size: 0.88rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 7px;
}
.nav-tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.nav-tab.active { background: var(--accent); color: #fff; }
.tab-badge { font-size: 0.72rem; padding: 1px 7px; border-radius: 10px; background: rgba(0,0,0,0.28); color: #fff; }
.tab-badge-warn { background: #5a3807; color: #fbbf24; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
.row:last-child { margin-bottom: 0; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.field input, .field select, .field textarea {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 8px 10px; font-size: 0.88rem;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.field.grow { flex: 1; min-width: 220px; }
.sort-group { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.sort-group label { display: flex; align-items: center; gap: 5px; font-size: 0.88rem; cursor: pointer; }
.sort-group input[type=radio], .sort-group input[type=checkbox] { accent-color: var(--accent); }

button.btn-primary, button[type=submit] {
  background: var(--accent); color: #fff; border: none; border-radius: 6px;
  padding: 8px 20px; font-size: 0.88rem; font-weight: 600; cursor: pointer; white-space: nowrap; height: 36px;
}
button.btn-primary:hover, button[type=submit]:hover { background: var(--accent-hover); }
button.btn-secondary, #countBtn, #todayBtn {
  background: #2d3147; color: var(--text); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 16px; font-size: 0.86rem; cursor: pointer; white-space: nowrap; height: 36px;
}
button.btn-secondary:hover, #countBtn:hover, #todayBtn:hover { background: #3a3f5c; }
button.btn-sm { padding: 5px 11px; height: auto; font-size: 0.78rem; border-radius: 5px; }
button:disabled { opacity: 0.5; cursor: default; }

/* Filter Pills & Summary Strip */
.pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  background: var(--bg); color: var(--muted); border: 1px solid var(--border);
  border-radius: 20px; padding: 6px 13px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
}
.pill:hover { color: var(--text); border-color: #464d6e; }
.pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.pill-unfam.active { background: #b45309; border-color: #f59e0b; color: #fff; }
.pill-fam.active { background: #047857; border-color: #10b981; color: #fff; }

.stats-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 15px; display: flex; flex-direction: column; gap: 3px; cursor: pointer;
}
.stat-box:hover { border-color: #464d6e; }
.stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.stat-val { font-size: 1.35rem; font-weight: 700; color: #fff; }
.stat-val.unfam { color: var(--unfam); }
.stat-val.fam { color: var(--fam); }

/* Count Panel */
#countPanel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; display: none; }
#countPanel h2 { font-size: 1rem; margin-bottom: 14px; color: #fff; }
.count-grid { display: flex; gap: 24px; flex-wrap: wrap; }
.count-section { flex: 1; min-width: 160px; }
.count-section h3 { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.count-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
.count-row:last-child { border-bottom: none; }
.count-val { font-weight: 600; color: var(--accent); }

.status-line { color: var(--muted); font-size: 0.88rem; margin-bottom: 14px; min-height: 1.4em; }

/* Card Grids */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: border-color 0.15s; }
.card:hover { border-color: #464d6e; }
.card.clickable { cursor: pointer; }
.thumb-link { display: block; position: relative; }
.thumb { display: block; width: 100%; height: 185px; object-fit: cover; background: #111; }
.no-img { width: 100%; height: 185px; background: #111; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.8rem; }
.card-body { padding: 12px 14px; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }

.badge { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.05em; display: inline-flex; align-items: center; gap: 4px; }
.badge-person     { background: #1a3d2c; color: var(--person); }
.badge-car        { background: #3d2610; color: var(--car); }
.badge-motorcycle { background: #2a1b40; color: var(--motorcycle); }
.badge-bicycle    { background: #12313d; color: var(--bicycle); }
.badge-unknown    { background: #222; color: var(--muted); }
.badge-segment    { background: #10303d; color: #6fd3e8; }
.badge-unfam      { background: #452706; color: #fbbf24; border: 1px solid #92400e; }
.badge-fam        { background: #06392c; color: #34d399; border: 1px solid #065f46; }
.badge-veh-link {
  background: #1e294a; color: #93c5fd; border: 1px solid #3b5398; cursor: pointer;
  text-transform: none; font-size: 0.73rem; padding: 2px 8px; border-radius: 8px; font-weight: 600;
}
.badge-veh-link:hover { background: #2b3b6b; color: #fff; }

.card-segment     { border-left: 3px solid #10303d; }
.card-segment .card-body { padding-top: 14px; }
.cam-label { font-size: 0.73rem; color: var(--muted); }
.card-time { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
.card-title { font-size: 0.96rem; font-weight: 700; color: #fff; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-desc { font-size: 0.83rem; line-height: 1.5; color: #cfd3e4; }
.card-meta-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 7px 0; }
.meta-chip { font-size: 0.72rem; background: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 2px 7px; border-radius: 5px; }
.meta-chip strong { color: var(--text); }
.card-foot { margin-top: 8px; font-size: 0.72rem; color: #6b728e; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card-foot span:last-child { margin-left: auto; }

/* Sightings Table / Timeline */
.sightings-list { display: flex; flex-direction: column; gap: 10px; }
.sighting-row {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; display: grid; grid-template-columns: 150px 1fr auto; gap: 14px; align-items: center;
}
@media (max-width: 720px) {
  .sighting-row { grid-template-columns: 1fr; }
}
.sighting-thumb { width: 150px; height: 96px; object-fit: cover; border-radius: 7px; background: #111; cursor: pointer; display: block; }
.cam-chain { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; background: #151926; border: 1px solid var(--border); padding: 2px 8px; border-radius: 6px; color: #a5b4fc; }

/* Vehicle Detail Modal / Drawer */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(5, 7, 12, 0.78); z-index: 1000;
  display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 28px 16px;
}
.modal-backdrop.open { display: flex; }
.modal-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  width: 100%; max-width: 1040px; padding: 22px 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
.modal-close { background: #2d3147; color: var(--text); border: none; border-radius: 7px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer; }
.modal-close:hover { background: #3e4361; }

.veh-hero { display: grid; grid-template-columns: 280px 1fr; gap: 18px; margin-bottom: 20px; }
@media (max-width: 760px) { .veh-hero { grid-template-columns: 1fr; } }
.veh-hero-img { width: 100%; height: 195px; object-fit: cover; border-radius: 10px; background: #111; border: 1px solid var(--border); cursor: pointer; }
.section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 18px 0 10px; font-weight: 700; }

.sim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
.sim-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px; display: flex; flex-direction: column; gap: 6px; }
.sim-card img { width: 100%; height: 105px; object-fit: cover; border-radius: 5px; background: #111; cursor: pointer; }

.pass-block { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; margin-bottom: 12px; }
.pass-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.pass-sightings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.pass-sight-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.pass-sight-card img { width: 100%; height: 145px; object-fit: cover; background: #111; cursor: pointer; display: block; }
.pass-sight-body { padding: 9px 11px; font-size: 0.8rem; }

/* Lightbox for full-frame zoom */
#lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000;
  display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
}
#lightbox.open { display: flex; }
#lightbox img { max-width: 95vw; max-height: 84vh; border-radius: 8px; border: 1px solid var(--border); }
#lightboxCaption { margin-top: 10px; color: var(--text); font-size: 0.88rem; text-align: center; }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1>
      <span>Thor Vision & Vehicle Re-ID</span>
      <span id="collTag" style="font-size:0.82rem;color:#e0b43a;"></span>
      <label style="font-size:0.75rem;color:#8890a8;font-weight:400;">collection
        <select id="collSel" title="Object collection to search"
                style="background:#0f1117;color:#e2e4ef;border:1px solid #2d3147;border-radius:6px;padding:3px 6px;font-size:0.78rem;"></select>
      </label>
    </h1>
    <p style="margin-top:5px; font-size:0.84rem;">
      <a href="/live" style="color:#4f6ef7; text-decoration:none; font-weight:600;">→ View Live Feeds (HLS)</a>
      &nbsp;|&nbsp;
      <span style="color:#8890a8;">Real-time DeepStream + FastReID + Gemma-4 vehicle tracking across cameras.</span>
    </p>
  </div>

  <div class="nav-tabs">
    <button type="button" class="nav-tab active" data-tab="search" onclick="switchTab('search')">
      Vision Search
    </button>
    <button type="button" class="nav-tab" data-tab="vehicles" onclick="switchTab('vehicles')">
      Vehicles <span class="tab-badge" id="navVehCount">…</span>
      <span class="tab-badge tab-badge-warn" id="navUnfamCount" title="Unfamiliar / single-pass vehicles" style="display:none;"></span>
    </button>
    <button type="button" class="nav-tab" data-tab="sightings" onclick="switchTab('sightings')">
      Sightings Log <span class="tab-badge" id="navSightCount">…</span>
    </button>
  </div>
</div>

<!-- ======================= TAB 1: VISION SEARCH ======================= -->
<div id="tab-search" class="tab-pane">
  <form class="panel" id="searchForm">
    <div class="row">
      <div class="field grow">
        <label>Description</label>
        <input type="text" id="text" placeholder="e.g. person in red shirt, white sedan, silver SUV…">
      </div>
      <div class="field">
        <label>Camera</label>
        <select id="camera">
          <option value="">All cameras</option>
          <option value="1">Camera 1</option>
          <option value="2">Camera 2</option>
          <option value="3">Camera 3</option>
          <option value="4">Camera 4</option>
          <option value="5">Camera 5</option>
          <option value="6">Camera 6</option>
        </select>
      </div>
      <div class="field">
        <label>Label</label>
        <select id="label">
          <option value="">All labels</option>
          <option value="person">Person</option>
          <option value="car">Car</option>
          <option value="bicycle">Bicycle</option>
          <option value="motorcycle">Motorcycle (old label, before 9/30 fix)</option>
        </select>
      </div>
      <div class="field">
        <label>Max results</label>
        <input type="number" id="maxResults" value="20" min="1" max="200" style="width:76px">
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button type="submit" id="searchBtn">Search</button>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button type="button" id="countBtn">Count</button>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>From (PDT)</label>
        <input type="datetime-local" id="startTime" step="1">
      </div>
      <div class="field">
        <label>To (PDT)</label>
        <input type="datetime-local" id="endTime" step="1">
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button type="button" id="todayBtn" title="Set From/To to cover all of today (PDT) and search">Today</button>
      </div>
      <div class="field" style="margin-left:8px">
        <label>Search type</label>
        <div class="sort-group">
          <label><input type="radio" name="search_type" value="semantic" checked> Semantic</label>
          <label><input type="radio" name="search_type" value="exact"> Exact text</label>
        </div>
      </div>
      <div class="field" style="margin-left:8px">
        <label>Sort</label>
        <div class="sort-group">
          <label><input type="radio" name="sort" value="relevance" checked> Relevance</label>
          <label><input type="radio" name="sort" value="time_desc"> Newest</label>
          <label><input type="radio" name="sort" value="time_asc"> Oldest</label>
        </div>
      </div>
      <div class="field" style="margin-left:8px">
        <label>Search in</label>
        <div class="sort-group">
          <label><input type="radio" name="sources" value="both" checked> Both</label>
          <label><input type="radio" name="sources" value="objects"> Objects</label>
          <label><input type="radio" name="sources" value="segments"> Segments</label>
        </div>
      </div>
    </div>
  </form>

  <div id="countPanel">
    <h2 id="countTitle"></h2>
    <div class="count-grid">
      <div class="count-section">
        <h3>By label</h3>
        <div id="countByLabel"></div>
      </div>
      <div class="count-section">
        <h3>By camera</h3>
        <div id="countByCamera"></div>
      </div>
    </div>
  </div>

  <div id="status" class="status-line"></div>
  <div id="results" class="card-grid"></div>
</div>

<!-- ======================= TAB 2: VEHICLES DIRECTORY ======================= -->
<div id="tab-vehicles" class="tab-pane" style="display:none;">
  <div class="stats-strip" id="vehStatsStrip">
    <div class="stat-box" onclick="setVehFilter('all')">
      <span class="stat-label">Total Active Vehicles</span>
      <span class="stat-val" id="stTotalVeh">—</span>
    </div>
    <div class="stat-box" onclick="setVehFilter('unfamiliar')">
      <span class="stat-label">Unfamiliar / Single-Pass ★</span>
      <span class="stat-val unfam" id="stUnfamVeh">—</span>
    </div>
    <div class="stat-box" onclick="setVehFilter('familiar')">
      <span class="stat-label">Familiar / Repeat Vehicles</span>
      <span class="stat-val fam" id="stFamVeh">—</span>
    </div>
    <div class="stat-box" onclick="switchTab('sightings')">
      <span class="stat-label">Passes / Sightings</span>
      <span class="stat-val" id="stPassesSightings">—</span>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label>Familiarity Filter</label>
        <div class="pill-group" id="vehFilterPills">
          <button type="button" class="pill active" data-val="all" onclick="setVehFilter('all')">All Vehicles</button>
          <button type="button" class="pill pill-unfam" data-val="unfamiliar" onclick="setVehFilter('unfamiliar')">★ Unfamiliar / New</button>
          <button type="button" class="pill pill-fam" data-val="familiar" onclick="setVehFilter('familiar')">✓ Familiar</button>
        </div>
      </div>
      <div class="field">
        <label>Class</label>
        <select id="vehCls" onchange="loadVehicles()">
          <option value="all">All classes</option>
          <option value="car">Cars / Trucks / SUVs</option>
          <option value="bicycle">Bicycles</option>
        </select>
      </div>
      <div class="field">
        <label>Camera</label>
        <select id="vehCam" onchange="loadVehicles()">
          <option value="">All street cams</option>
          <option value="cam3">cam3 (Driveway mid)</option>
          <option value="cam4">cam4 (Street left)</option>
          <option value="cam5">cam5 (Driveway top)</option>
          <option value="cam6">cam6 (Street front)</option>
        </select>
      </div>
      <div class="field grow">
        <label>Search Vehicle ID, Label, Color, Make/Model</label>
        <input type="text" id="vehSearch" placeholder="e.g. Tacoma, Land Rover, silver sedan, veh_020…" oninput="debouncedLoadVehicles()">
      </div>
      <div class="field">
        <label>Sort by</label>
        <select id="vehSort" onchange="loadVehicles()">
          <option value="last_seen">Last Seen (Newest)</option>
          <option value="first_seen">First Seen (Newest)</option>
          <option value="passes">Most Passes</option>
          <option value="sightings">Most Sightings</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button type="button" class="btn-secondary" onclick="loadVehicles()">Refresh</button>
      </div>
    </div>
  </div>

  <div id="vehStatus" class="status-line"></div>
  <div id="vehGrid" class="card-grid"></div>
</div>

<!-- ======================= TAB 3: SIGHTINGS LOG ======================= -->
<div id="tab-sightings" class="tab-pane" style="display:none;">
  <div class="panel">
    <div class="row">
      <div class="field grow">
        <label>Search Sightings / Description / Vehicle</label>
        <input type="text" id="sightSearch" placeholder="e.g. pickup, roof rails, veh_027…" oninput="debouncedLoadSightings()">
      </div>
      <div class="field">
        <label>Vehicle ID</label>
        <input type="text" id="sightVehId" placeholder="e.g. veh_020" style="width:120px" onchange="loadSightings()">
      </div>
      <div class="field">
        <label>Camera</label>
        <select id="sightCam" onchange="loadSightings()">
          <option value="">All cameras</option>
          <option value="cam3">cam3</option>
          <option value="cam4">cam4</option>
          <option value="cam5">cam5</option>
          <option value="cam6">cam6</option>
        </select>
      </div>
      <div class="field">
        <label>Class</label>
        <select id="sightCls" onchange="loadSightings()">
          <option value="all">All</option>
          <option value="car">Car / Truck</option>
          <option value="bicycle">Bicycle</option>
        </select>
      </div>
      <div class="field">
        <label>Quick Filters</label>
        <div class="sort-group" style="height:36px;">
          <label><input type="checkbox" id="sightUnfamOnly" onchange="loadSightings()"> ★ Unfamiliar only</label>
          <label><input type="checkbox" id="sightMultiCamOnly" onchange="loadSightings()"> Multi-cam passes only</label>
        </div>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button type="button" class="btn-secondary" onclick="loadSightings()">Refresh</button>
      </div>
    </div>
  </div>

  <div id="sightStatus" class="status-line"></div>
  <div id="sightList" class="sightings-list"></div>
</div>

<!-- ======================= VEHICLE DETAIL MODAL ======================= -->
<div id="vehModal" class="modal-backdrop" onclick="if(event.target===this)closeVehicleModal()">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <h2 id="mVehTitle" style="font-size:1.25rem;color:#fff;">Vehicle Details</h2>
          <span id="mVehIdBadge" class="badge badge-car"></span>
          <span id="mVehFamBadge" class="badge"></span>
        </div>
        <div id="mVehSub" style="font-size:0.8rem;color:var(--muted);margin-top:4px;"></div>
      </div>
      <button type="button" class="modal-close" onclick="closeVehicleModal()">✕ Close</button>
    </div>

    <div id="mVehBody"></div>
  </div>
</div>

<!-- ======================= FULL-FRAME LIGHTBOX ======================= -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
  <div id="lightboxCaption"></div>
</div>

<script>
const form    = document.getElementById('searchForm');
const btn     = document.getElementById('searchBtn');
const COLLECTION = new URLSearchParams(location.search).get('collection') || '';
if (COLLECTION) {
  document.getElementById('collTag').textContent = '· collection ' + COLLECTION;
  document.title = 'Vision Search · ' + COLLECTION;
}
function withCollection(params) {
  if (COLLECTION) params.set('collection', COLLECTION);
  return params;
}
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

let CURRENT_TAB = 'search';
let VEH_FILTER = 'all';
let ALL_ACTIVE_VEHICLES = [];
let CURRENT_MODAL_VID = null;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openLightbox(url, caption) {
  if (!url) return;
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightboxCaption').textContent = caption || url;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

function switchTab(tab) {
  CURRENT_TAB = tab;
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-search').style.display    = tab === 'search'    ? 'block' : 'none';
  document.getElementById('tab-vehicles').style.display  = tab === 'vehicles'  ? 'block' : 'none';
  document.getElementById('tab-sightings').style.display = tab === 'sightings' ? 'block' : 'none';
  if (tab === 'vehicles') loadVehicles();
  if (tab === 'sightings') loadSightings();
}

// Collection switcher
let DEFAULT_COLLECTION = '';
(async () => {
  const sel = document.getElementById('collSel');
  try {
    const resp = await fetch('/collections');
    const data = await resp.json();
    DEFAULT_COLLECTION = data.default || '';
    for (const c of data.collections || []) {
      const o = document.createElement('option');
      o.value = c.name;
      o.textContent = c.name + (c.name === data.default ? ' (default)' : '')
                      + (c.count != null ? ` · ${c.count}` : ' · unavailable');
      sel.appendChild(o);
    }
    sel.value = COLLECTION || DEFAULT_COLLECTION;
  } catch { sel.style.display = 'none'; }
  sel.addEventListener('change', () => {
    const q = new URLSearchParams(location.search);
    if (sel.value && sel.value !== DEFAULT_COLLECTION) q.set('collection', sel.value);
    else q.delete('collection');
    location.search = q.toString();
  });
})();

// Load vehicle badge counts for top nav on startup
async function refreshNavCounts() {
  try {
    const resp = await fetch('/api/vehicles');
    if (!resp.ok) return;
    const data = await resp.json();
    const s = data.summary || {};
    ALL_ACTIVE_VEHICLES = data.vehicles || [];
    document.getElementById('navVehCount').textContent = s.total_vehicles ?? 0;
    document.getElementById('navSightCount').textContent = s.total_sightings ?? 0;
    const uEl = document.getElementById('navUnfamCount');
    if ((s.unfamiliar_count || 0) > 0) {
      uEl.textContent = `★ ${s.unfamiliar_count} new`;
      uEl.style.display = 'inline-block';
    } else {
      uEl.style.display = 'none';
    }
  } catch {}
}
refreshNavCounts();

const URL_FIELDS = {text: 'text', n: 'maxResults', start_time: 'startTime',
                    end_time: 'endTime', label: 'label', camera_id: 'camera'};
const URL_RADIOS = {sort_by: 'sort', search_type: 'search_type', sources: 'sources'};
function formFromUrl() {
  const q = new URLSearchParams(location.search);
  for (const [k, id] of Object.entries(URL_FIELDS))
    if (q.has(k)) document.getElementById(id).value = q.get(k);
  for (const [k, name] of Object.entries(URL_RADIOS)) {
    const r = q.has(k) && document.querySelector(`input[name=${name}][value="${CSS.escape(q.get(k))}"]`);
    if (r) r.checked = true;
  }
  if (q.get('tab') === 'vehicles') switchTab('vehicles');
  else if (q.get('tab') === 'sightings') switchTab('sightings');
  if (q.get('vehicle_id')) openVehicleModal(q.get('vehicle_id'));
}
function urlFromForm(params) {
  const q = new URLSearchParams();
  if (COLLECTION) q.set('collection', COLLECTION);
  const defaults = {n: '20', sort_by: 'relevance', search_type: 'semantic', sources: 'both'};
  for (const [k, v] of params) if (k !== 'collection' && v && v !== defaults[k]) q.set(k, v);
  const qs = q.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
}

async function runSearch() {
  resultsEl.innerHTML = '';
  statusEl.textContent = 'Searching…';
  btn.disabled = true;

  const params = new URLSearchParams({
    text:        document.getElementById('text').value.trim(),
    n:           document.getElementById('maxResults').value,
    start_time:  document.getElementById('startTime').value,
    end_time:    document.getElementById('endTime').value,
    sort_by:     document.querySelector('input[name=sort]:checked').value,
    label:       document.getElementById('label').value,
    camera_id:   document.getElementById('camera').value,
    search_type: document.querySelector('input[name=search_type]:checked').value,
    sources:     document.querySelector('input[name=sources]:checked').value,
  });

  urlFromForm(params);
  try {
    const resp = await fetch('/query?' + withCollection(params));
    const data = await resp.json();
    if (!resp.ok) {
      statusEl.textContent = 'Error: ' + (data.detail || resp.statusText);
      return;
    }
    const results = data.results || [];
    const what = params.get('text') ? '' : ' (newest; type a description to search)';
    statusEl.textContent = (results.length
      ? `${results.length} result${results.length === 1 ? '' : 's'}`
      : 'No results found.') + (data.collection ? ` in ${data.collection}` : '') + what;
    resultsEl.innerHTML = results.map(card).join('');
  } catch (err) {
    statusEl.textContent = 'Request failed: ' + err.message;
  } finally {
    btn.disabled = false;
  }
}

form.addEventListener('submit', (e) => { e.preventDefault(); runSearch(); });

document.getElementById('todayBtn').addEventListener('click', () => {
  const day = new Date().toLocaleDateString('en-CA', {timeZone: 'America/Los_Angeles'});
  document.getElementById('startTime').value = `${day}T00:00:00`;
  document.getElementById('endTime').value   = `${day}T23:59:59`;
  runSearch();
});

function fmtTime(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleString('en-US', {
      timeZone: 'America/Los_Angeles',
      month: 'short', day: 'numeric', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    }) + ' PDT';
  } catch { return iso; }
}

function badgeClass(label) {
  return 'badge-' + ({'person':'person','car':'car','motorcycle':'motorcycle','bicycle':'bicycle'}[label] || 'unknown');
}

document.getElementById('countBtn').addEventListener('click', async () => {
  const btn = document.getElementById('countBtn');
  btn.disabled = true;
  const panel = document.getElementById('countPanel');
  panel.style.display = 'none';

  const params = new URLSearchParams({
    start_time: document.getElementById('startTime').value,
    end_time:   document.getElementById('endTime').value,
    label:      document.getElementById('label').value,
    camera_id:  document.getElementById('camera').value,
  });

  try {
    const resp = await fetch('/count?' + withCollection(params));
    const data = await resp.json();
    if (!resp.ok) {
      statusEl.textContent = 'Count error: ' + (data.detail || resp.statusText);
      return;
    }
    document.getElementById('countTitle').textContent =
      `${data.total} event${data.total === 1 ? '' : 's'} matched`;

    const rows = (obj) => Object.entries(obj)
      .map(([k, v]) => `<div class="count-row"><span>${esc(k)}</span><span class="count-val">${v}</span></div>`)
      .join('') || '<div class="count-row"><span>—</span></div>';

    document.getElementById('countByLabel').innerHTML  = rows(data.by_label);
    document.getElementById('countByCamera').innerHTML = rows(data.by_camera);
    panel.style.display = 'block';
  } catch (err) {
    statusEl.textContent = 'Count failed: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});

function card(r) {
  const dist = r.distance != null ? `<span>dist&nbsp;${r.distance}</span>` : '';

  if (r.kind === 'segment') {
    const win = (r.start_s != null && r.end_s != null)
      ? `${Math.round(r.start_s)}–${Math.round(r.end_s)}s`
      : (r.duration_s != null ? `${Math.round(r.duration_s)}s window` : '');
    return `
<div class="card card-segment">
  <div class="card-body">
    <div class="card-top">
      <span class="badge badge-segment">segment</span>
      <span class="cam-label">camera&nbsp;${r.camera_id ?? '?'}</span>
    </div>
    <div class="card-time">${fmtTime(r.wall_time)}${win ? ' · ' + win : ''}</div>
    <div class="card-desc">${esc(r.document || '')}</div>
    <div class="card-foot">
      ${dist}
      <span>${esc(r.id)}</span>
    </div>
  </div>
</div>`;
  }

  const img = r.image_url
    ? `<a class="thumb-link" href="${esc(r.image_url)}" target="_blank">
         <img class="thumb" src="${esc(r.image_url)}" loading="lazy" alt="${esc(r.label || '')}">
       </a>`
    : `<div class="no-img">No snapshot</div>`;

  const vehBadge = r.vehicle_id
    ? `<span class="badge-veh-link" onclick="event.stopPropagation(); openVehicleModal('${esc(r.vehicle_id)}')" title="Open Vehicle Re-ID profile">
         🚗 ${esc(r.vehicle_id)}${r.vehicle_label ? ' · ' + esc(r.vehicle_label) : ''}${r.is_unfamiliar == 1 ? ' ★' : ''}
       </span>`
    : '';

  return `
<div class="card">
  ${img}
  <div class="card-body">
    <div class="card-top">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        <span class="badge ${badgeClass(r.label)}">${esc(r.label || '?')}</span>
        ${vehBadge}
      </div>
      <span class="cam-label">camera&nbsp;${r.camera_id ?? '?'}</span>
    </div>
    <div class="card-time">${fmtTime(r.wall_time)}</div>
    <div class="card-desc">${esc(r.document || '')}</div>
    <div class="card-foot">
      <span>conf&nbsp;${r.confidence}</span>
      ${dist}
      <span>${esc(r.id)}</span>
    </div>
  </div>
</div>`;
}

// ======================= VEHICLES TAB LOGIC =======================
let _vehDebounce = null;
function debouncedLoadVehicles() {
  clearTimeout(_vehDebounce);
  _vehDebounce = setTimeout(loadVehicles, 220);
}

function setVehFilter(val) {
  VEH_FILTER = val;
  document.querySelectorAll('#vehFilterPills .pill').forEach(p => {
    p.classList.toggle('active', p.dataset.val === val);
  });
  loadVehicles();
}

async function loadVehicles() {
  const status = document.getElementById('vehStatus');
  const grid = document.getElementById('vehGrid');
  status.textContent = 'Loading vehicles…';

  const params = new URLSearchParams({
    filter: VEH_FILTER,
    cls:    document.getElementById('vehCls').value,
    cam:    document.getElementById('vehCam').value,
    q:      document.getElementById('vehSearch').value.trim(),
    sort:   document.getElementById('vehSort').value,
  });

  try {
    const resp = await fetch('/api/vehicles?' + params.toString());
    const data = await resp.json();
    if (!resp.ok) {
      status.textContent = 'Error: ' + (data.detail || resp.statusText);
      return;
    }
    const s = data.summary || {};
    document.getElementById('stTotalVeh').textContent = s.total_vehicles ?? 0;
    document.getElementById('stUnfamVeh').textContent = s.unfamiliar_count ?? 0;
    document.getElementById('stFamVeh').textContent   = s.familiar_count ?? 0;
    document.getElementById('stPassesSightings').textContent = `${s.total_passes ?? 0} / ${s.total_sightings ?? 0}`;
    document.getElementById('navVehCount').textContent = s.total_vehicles ?? 0;
    document.getElementById('navSightCount').textContent = s.total_sightings ?? 0;

    const vehicles = data.vehicles || [];
    if (!SINGLE_LOAD_CACHE_DONE || VEH_FILTER === 'all') {
      ALL_ACTIVE_VEHICLES = vehicles;
      SINGLE_LOAD_CACHE_DONE = true;
    }
    status.textContent = `${vehicles.length} vehicle${vehicles.length === 1 ? '' : 's'} shown`;
    grid.innerHTML = vehicles.map(renderVehicleCard).join('');
  } catch (err) {
    status.textContent = 'Failed loading vehicles: ' + err.message;
  }
}
let SINGLE_LOAD_CACHE_DONE = false;

function renderVehicleCard(v) {
  const img = v.rep_crop_url
    ? `<img class="thumb" src="${esc(v.rep_crop_url)}" loading="lazy" alt="${esc(v.label)}">`
    : `<div class="no-img">No crop</div>`;

  const famBadge = v.is_familiar
    ? `<span class="badge badge-fam">✓ Familiar (${v.pass_count} pass${v.pass_count===1?'':'es'})</span>`
    : `<span class="badge badge-unfam">★ Unfamiliar (1st pass)</span>`;

  const cams = (v.cameras_seen || []).join(', ') || '—';
  const mm = (v.make_model && v.make_model !== 'unknown') ? `<span class="meta-chip"><strong>Make:</strong> ${esc(v.make_model)}</span>` : '';
  const roof = (v.roof_trim && v.roof_trim !== 'none' && v.roof_trim !== 'unknown') ? `<span class="meta-chip"><strong>Trim:</strong> ${esc(v.roof_trim)}</span>` : '';

  return `
<div class="card clickable" onclick="openVehicleModal('${esc(v.vehicle_id)}')">
  ${img}
  <div class="card-body">
    <div class="card-top">
      <span class="badge ${badgeClass(v.cls)}">${esc(v.vehicle_id)} · ${esc(v.cls)}</span>
      ${famBadge}
    </div>
    <div class="card-title">
      <span>${esc(v.label)} ${v.custom_label ? '<span title="Custom user label" style="color:#60a5fa;font-size:0.75rem;">✎</span>' : ''}</span>
    </div>
    <div class="card-meta-tags">
      <span class="meta-chip"><strong>Color:</strong> ${esc(v.color)}</span>
      <span class="meta-chip"><strong>Type:</strong> ${esc(v.body_type)}</span>
      ${mm}
      ${roof}
      <span class="meta-chip"><strong>Cams:</strong> ${esc(cams)}</span>
    </div>
    <div class="card-time" style="margin-top:6px;">
      <div><strong>Last:</strong> ${fmtTime(v.last_seen_iso)}</div>
      <div><strong>First:</strong> ${fmtTime(v.first_seen_iso)}</div>
    </div>
    <div class="card-foot">
      <span><strong>${v.pass_count}</strong> pass${v.pass_count===1?'':'es'}</span>
      <span><strong>${v.sighting_count}</strong> sighting${v.sighting_count===1?'':'s'}</span>
      <span style="color:var(--accent);font-weight:600;">Inspect / Merge →</span>
    </div>
  </div>
</div>`;
}

// ======================= SIGHTINGS LOG TAB LOGIC =======================
let _sightDebounce = null;
function debouncedLoadSightings() {
  clearTimeout(_sightDebounce);
  _sightDebounce = setTimeout(loadSightings, 220);
}

async function loadSightings() {
  const status = document.getElementById('sightStatus');
  const list = document.getElementById('sightList');
  status.textContent = 'Loading sightings log…';

  const params = new URLSearchParams({
    q:               document.getElementById('sightSearch').value.trim(),
    vehicle_id:      document.getElementById('sightVehId').value.trim(),
    cam:             document.getElementById('sightCam').value,
    cls:             document.getElementById('sightCls').value,
    unfamiliar_only: document.getElementById('sightUnfamOnly').checked ? '1' : '0',
    multi_cam_only:  document.getElementById('sightMultiCamOnly').checked ? '1' : '0',
    limit:           '150',
  });

  try {
    const resp = await fetch('/api/vehicle_sightings?' + params.toString());
    const data = await resp.json();
    if (!resp.ok) {
      status.textContent = 'Error: ' + (data.detail || resp.statusText);
      return;
    }
    const items = data.sightings || [];
    status.textContent = `${items.length} sighting${items.length === 1 ? '' : 's'} matching filter`;
    list.innerHTML = items.map(renderSightingRow).join('');
  } catch (err) {
    status.textContent = 'Failed loading sightings: ' + err.message;
  }
}

function renderSightingRow(s) {
  const famBadge = s.vehicle_is_familiar
    ? `<span class="badge badge-fam">✓ Familiar</span>`
    : `<span class="badge badge-unfam">★ Unfamiliar</span>`;
  const camsChain = (s.pass_cameras || [s.cam]).join(' → ');
  const fullUrl = s.full_frame_url || s.sub_snapshot_url || s.crop_url || '';

  return `
<div class="sighting-row">
  <img class="sighting-thumb" src="${esc(s.crop_url || fullUrl)}" loading="lazy"
       onclick="openLightbox('${esc(fullUrl)}', '${esc(s.vehicle_id)} · ${esc(s.vehicle_label)} · ${esc(s.cam)} · ${fmtTime(s.timestamp_iso)}')"
       title="Click to view full frame">
  <div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;">
      <span class="badge-veh-link" onclick="openVehicleModal('${esc(s.vehicle_id)}')">
        ${esc(s.vehicle_id)} · ${esc(s.vehicle_label)}
      </span>
      ${famBadge}
      <span class="cam-chain" title="Pass #${s.pass_id} cameras">Pass #${s.pass_id}: ${esc(camsChain)}</span>
      <span class="cam-label">method: <strong>${esc(s.pass_match_method)}</strong> (sim ${s.best_sim})</span>
    </div>
    <div class="card-time">${fmtTime(s.timestamp_iso)} · <strong>${esc(s.cam)}</strong> · crop ${s.crop_w}×${s.crop_h}px</div>
    <div class="card-desc">${esc(s.vlm_description || '')}</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
    <button type="button" class="btn-secondary btn-sm" onclick="openVehicleModal('${esc(s.vehicle_id)}')">Vehicle Profile</button>
    ${fullUrl ? `<button type="button" class="btn-secondary btn-sm" onclick="openLightbox('${esc(fullUrl)}', 'Full Frame · ${esc(s.cam)} · ${fmtTime(s.timestamp_iso)}')">Full Frame</button>` : ''}
  </div>
</div>`;
}

// ======================= VEHICLE MODAL (EDIT / MERGE / SPLIT) =======================
async function openVehicleModal(vehicleId) {
  CURRENT_MODAL_VID = vehicleId;
  const modal = document.getElementById('vehModal');
  const body = document.getElementById('mVehBody');
  document.getElementById('mVehTitle').textContent = `Loading ${vehicleId}…`;
  body.innerHTML = `<div style="padding:24px;color:var(--muted);">Loading vehicle details…</div>`;
  modal.classList.add('open');

  try {
    // Also ensure we have the active vehicle list for the merge dropdown
    const [resp, listResp] = await Promise.all([
      fetch(`/api/vehicles/${encodeURIComponent(vehicleId)}`),
      fetch('/api/vehicles'),
    ]);
    const data = await resp.json();
    if (!resp.ok) {
      body.innerHTML = `<div style="color:var(--danger);padding:16px;">${esc(data.detail || 'Failed to load vehicle')}</div>`;
      return;
    }
    if (listResp.ok) {
      const ld = await listResp.json();
      ALL_ACTIVE_VEHICLES = ld.vehicles || [];
    }
    renderVehicleModal(data);
  } catch (err) {
    body.innerHTML = `<div style="color:var(--danger);padding:16px;">Error: ${esc(err.message)}</div>`;
  }
}

function closeVehicleModal() {
  document.getElementById('vehModal').classList.remove('open');
  CURRENT_MODAL_VID = null;
}

function renderVehicleModal(data) {
  const v = data.vehicle;
  const passes = data.passes || [];
  const similar = data.similar_vehicles || [];

  document.getElementById('mVehTitle').textContent = v.label || v.vehicle_id;
  const idBadge = document.getElementById('mVehIdBadge');
  idBadge.textContent = `${v.vehicle_id} · ${v.cls}`;
  idBadge.className = `badge ${badgeClass(v.cls)}`;

  const famBadge = document.getElementById('mVehFamBadge');
  if (v.is_familiar) {
    famBadge.textContent = `✓ Familiar (${v.pass_count} passes, ${v.sighting_count} sightings)`;
    famBadge.className = 'badge badge-fam';
  } else {
    famBadge.textContent = `★ Unfamiliar (1st pass, ${v.sighting_count} sighting${v.sighting_count===1?'':'s'})`;
    famBadge.className = 'badge badge-unfam';
  }

  document.getElementById('mVehSub').textContent =
    `First seen: ${fmtTime(v.first_seen_iso)} · Last seen: ${fmtTime(v.last_seen_iso)} · Cameras: ${(v.cameras_seen||[]).join(', ')}`
    + (v.merged_children && v.merged_children.length ? ` · Absorbed merges: ${v.merged_children.join(', ')}` : '');

  const otherOptions = ALL_ACTIVE_VEHICLES
    .filter(o => o.vehicle_id !== v.vehicle_id)
    .map(o => `<option value="${esc(o.vehicle_id)}">${esc(o.vehicle_id)} — ${esc(o.label)} (${o.pass_count}p/${o.sighting_count}s)</option>`)
    .join('');

  const simHtml = similar.length
    ? `<div class="sim-grid">
        ${similar.slice(0, 4).map(sv => `
          <div class="sim-card">
            <img src="${esc(sv.rep_crop_url || '')}" alt="${esc(sv.label)}"
                 onclick="openVehicleModal('${esc(sv.vehicle_id)}')" title="Click to inspect ${esc(sv.vehicle_id)}">
            <div style="font-size:0.8rem;font-weight:700;color:#fff;">${esc(sv.vehicle_id)} · sim ${sv.similarity}</div>
            <div style="font-size:0.76rem;color:var(--muted);">${esc(sv.label)}</div>
            <div style="font-size:0.72rem;color:var(--muted);">${sv.pass_count} pass · ${(sv.cameras_seen||[]).join(', ')}</div>
            <button type="button" class="btn-primary btn-sm" onclick="mergeVehicles('${esc(sv.vehicle_id)}', '${esc(v.vehicle_id)}')">
              Merge ${esc(sv.vehicle_id)} → ${esc(v.vehicle_id)}
            </button>
          </div>
        `).join('')}
       </div>`
    : `<div style="font-size:0.82rem;color:var(--muted);">No other vehicles with embeddings to compare.</div>`;

  const passesHtml = passes.map(p => {
    const pSights = p.sightings || [];
    const camsStr = (p.cameras || []).join(' → ');
    return `
      <div class="pass-block">
        <div class="pass-header">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <strong style="color:#fff;">Pass #${p.pass_id}</strong>
            <span class="cam-chain">${esc(camsStr)}</span>
            <span style="font-size:0.78rem;color:var(--muted);">${fmtTime(p.start_iso)} (${p.duration_s}s window · dir: ${esc(p.direction)})</span>
            <span style="font-size:0.75rem;color:var(--muted);">method: <strong>${esc(p.match_method)}</strong> (score ${p.match_score})</span>
            ${p.is_new_vehicle ? '<span class="badge badge-unfam">1st Pass</span>' : ''}
          </div>
          ${passes.length > 1 ? `
            <button type="button" class="btn-secondary btn-sm" onclick="splitPass(${p.pass_id})" title="Split this entire pass out into a new separate vehicle">
              Split Pass #${p.pass_id} → New Vehicle
            </button>
          ` : ''}
        </div>
        <div class="pass-sightings-grid">
          ${pSights.map(s => {
            const fullImg = s.full_frame_url || s.sub_snapshot_url || s.crop_url || '';
            return `
              <div class="pass-sight-card">
                <img src="${esc(s.crop_url || fullImg)}" loading="lazy"
                     onclick="openLightbox('${esc(fullImg)}', 'Full Frame · ${esc(s.cam)} · ${fmtTime(s.timestamp_iso)}')"
                     title="Click to zoom full frame">
                <div class="pass-sight-body">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                    <strong>${esc(s.cam)} · #${s.sighting_id}</strong>
                    <span style="color:var(--muted);font-size:0.73rem;">${s.crop_w}×${s.crop_h}px · sim ${s.best_sim}</span>
                  </div>
                  <div style="color:var(--muted);font-size:0.74rem;margin-bottom:5px;">${fmtTime(s.timestamp_iso)}</div>
                  <div style="font-size:0.78rem;color:#cfd3e4;line-height:1.4;margin-bottom:8px;">${esc(s.vlm_description || '')}</div>
                  <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    ${fullImg ? `<button type="button" class="btn-secondary btn-sm" onclick="openLightbox('${esc(fullImg)}', 'Full Frame · ${esc(s.cam)} · ${fmtTime(s.timestamp_iso)}')">Full Frame</button>` : ''}
                    ${(v.sighting_count > 1) ? `<button type="button" class="btn-secondary btn-sm" onclick="splitSighting(${s.sighting_id})">Split Sighting → New</button>` : ''}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('mVehBody').innerHTML = `
    <div class="veh-hero">
      <img class="veh-hero-img" src="${esc(v.rep_crop_url || '')}" alt="${esc(v.label)}"
           onclick="openLightbox('${esc(v.rep_crop_url || '')}', '${esc(v.vehicle_id)} · Representative Crop')">
      <div>
        <div class="row" style="margin-bottom:10px;">
          <div class="field grow">
            <label>Vehicle Label (Custom Name or Auto-Description)</label>
            <input type="text" id="editVehLabel" value="${esc(v.label)}">
          </div>
          <div class="field">
            <label>Familiarity Status</label>
            <select id="editVehFamiliar">
              <option value="0" ${v.is_familiar ? '' : 'selected'}>★ Unfamiliar / New</option>
              <option value="1" ${v.is_familiar ? 'selected' : ''}>✓ Familiar / Known</option>
            </select>
          </div>
          <div class="field">
            <label>&nbsp;</label>
            <button type="button" class="btn-primary" onclick="saveVehicleDetails('${esc(v.vehicle_id)}')">Save Changes</button>
          </div>
        </div>
        <div class="row" style="margin-bottom:10px;">
          <div class="field">
            <label>Color</label>
            <input type="text" id="editVehColor" value="${esc(v.color)}" style="width:120px">
          </div>
          <div class="field">
            <label>Body Type</label>
            <input type="text" id="editVehBody" value="${esc(v.body_type)}" style="width:130px">
          </div>
          <div class="field">
            <label>Make / Model</label>
            <input type="text" id="editVehMake" value="${esc(v.make_model)}" style="width:160px">
          </div>
          <div class="field">
            <label>Roof / Trim</label>
            <input type="text" id="editVehRoof" value="${esc(v.roof_trim)}" style="width:140px">
          </div>
          <div class="field grow">
            <label>Notes / Plate</label>
            <input type="text" id="editVehNotes" value="${esc(v.notes || v.plate_partial || '')}" placeholder="Optional notes…">
          </div>
        </div>
        <div id="editSaveMsg" style="font-size:0.8rem;color:var(--fam);min-height:1.2em;"></div>
      </div>
    </div>

    <div class="section-title">Merge With Another Vehicle (Top Visually Similar + Manual Pick)</div>
    ${simHtml}
    <div class="row" style="margin-top:10px;align-items:center;">
      <div class="field grow">
        <label>Or pick any active vehicle to merge into ${esc(v.vehicle_id)}</label>
        <select id="manualMergeSelect">
          <option value="">— Select a vehicle to merge into ${esc(v.vehicle_id)} —</option>
          ${otherOptions}
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button type="button" class="btn-secondary" onclick="mergeSelectedIntoCurrent('${esc(v.vehicle_id)}')">Merge Selected → ${esc(v.vehicle_id)}</button>
      </div>
    </div>

    <div class="section-title">Passes & Multi-Camera Sightings (${passes.length} pass${passes.length===1?'':'es'}, ${v.sighting_count} sighting${v.sighting_count===1?'':'s'})</div>
    ${passesHtml}
  `;
}

async function saveVehicleDetails(vehicleId) {
  const msg = document.getElementById('editSaveMsg');
  msg.textContent = 'Saving…';
  const payload = {
    label:       document.getElementById('editVehLabel').value.trim(),
    is_familiar: parseInt(document.getElementById('editVehFamiliar').value, 10),
    color:       document.getElementById('editVehColor').value.trim(),
    body_type:   document.getElementById('editVehBody').value.trim(),
    make_model:  document.getElementById('editVehMake').value.trim(),
    roof_trim:   document.getElementById('editVehRoof').value.trim(),
    notes:       document.getElementById('editVehNotes').value.trim(),
  };
  try {
    const resp = await fetch(`/api/vehicles/${encodeURIComponent(vehicleId)}/update`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (!resp.ok) {
      msg.style.color = 'var(--danger)';
      msg.textContent = 'Error: ' + (data.detail || resp.statusText);
      return;
    }
    msg.style.color = 'var(--fam)';
    msg.textContent = '✓ Saved vehicle profile and synced ChromaDB metadata';
    await openVehicleModal(vehicleId);
    if (CURRENT_TAB === 'vehicles') loadVehicles();
    if (CURRENT_TAB === 'sightings') loadSightings();
    refreshNavCounts();
  } catch (err) {
    msg.style.color = 'var(--danger)';
    msg.textContent = 'Save failed: ' + err.message;
  }
}

async function mergeVehicles(sourceId, targetId) {
  if (!sourceId || !targetId || sourceId === targetId) return;
  try {
    const resp = await fetch('/api/vehicles/merge', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({source_id: sourceId, target_id: targetId}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      alert('Merge error: ' + (data.detail || resp.statusText));
      return;
    }
    await openVehicleModal(targetId);
    if (CURRENT_TAB === 'vehicles') loadVehicles();
    if (CURRENT_TAB === 'sightings') loadSightings();
    refreshNavCounts();
  } catch (err) {
    alert('Merge failed: ' + err.message);
  }
}

function mergeSelectedIntoCurrent(targetId) {
  const sel = document.getElementById('manualMergeSelect');
  if (!sel || !sel.value) return;
  mergeVehicles(sel.value, targetId);
}

async function splitPass(passId) {
  try {
    const resp = await fetch('/api/vehicles/split', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({pass_ids: [passId], target_vehicle_id: 'new'}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      alert('Split error: ' + (data.detail || resp.statusText));
      return;
    }
    const newVid = data.target_vehicle?.vehicle_id;
    if (newVid) await openVehicleModal(newVid);
    if (CURRENT_TAB === 'vehicles') loadVehicles();
    if (CURRENT_TAB === 'sightings') loadSightings();
    refreshNavCounts();
  } catch (err) {
    alert('Split failed: ' + err.message);
  }
}

async function splitSighting(sightingId) {
  try {
    const resp = await fetch('/api/vehicles/split', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({sighting_ids: [sightingId], target_vehicle_id: 'new'}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      alert('Split error: ' + (data.detail || resp.statusText));
      return;
    }
    const newVid = data.target_vehicle?.vehicle_id;
    if (newVid) await openVehicleModal(newVid);
    if (CURRENT_TAB === 'vehicles') loadVehicles();
    if (CURRENT_TAB === 'sightings') loadSightings();
    refreshNavCounts();
  } catch (err) {
    alert('Split failed: ' + err.message);
  }
}

// Initial page boot
formFromUrl();
runSearch();
</script>
