# Single-container multi-stream pipeline (pipeline_multi.py).
# Develop on DGX Spark; deploy the same compose file on Jetson Thor.

x-deepstream: &deepstream
  build: .
  image: cam1-deepstream
  runtime: nvidia
  network_mode: host
  privileged: true
  env_file: .env
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - /etc/X11:/etc/X11
    - .:/workspace
  working_dir: /workspace
  stdin_open: true
  tty: true
  command: sleep infinity
  depends_on:
    chromadb:
      condition: service_healthy

services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  deepstream:
    <<: *deepstream
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
      VLM_MODEL: "${VLM_MODEL:-gemma4:26b}"
      OLLAMA_HOST: "${OLLAMA_HOST:-http://127.0.0.1:11434}"
      DISPLAY: "${DISPLAY:-:0}"
      XAUTHORITY: /root/.Xauthority
      FRAME_W: "${FRAME_W:-1280}"
      FRAME_H: "${FRAME_H:-720}"
      ENABLE_DISPLAY: "${ENABLE_DISPLAY:-0}"
      HEADLESS: "${HEADLESS:-1}"
      LIVE_STREAM: "${LIVE_STREAM:-1}"
      TILER_W: "${TILER_W:-1280}"
      TILER_H: "${TILER_H:-720}"
      SAVE_INTERVAL: "${SAVE_INTERVAL:-30.0}"
      VLM_QUEUE_MAX: "${VLM_QUEUE_MAX:-12}"
      CHROMADB_HOST: "127.0.0.1"
      CHROMADB_PORT: "8000"

  # Option (c) segment sidecar: Cosmos-Reason2 "what happened" summaries for the
  # STREET cams -> ChromaDB `vision_segments`. Opt-in (profile), heavy (~7min
  # model load, ~20GB GPU). Image is pre-built by the Phase 3 spike process
  # (vllm-ds-spike:latest = sbsa base + install.sh + chromadb/ollama clients).
  # Start with:  docker compose -f cam_multi.yml --profile segments up -d segments
  # Requires the DeepStream repo cloned at ../DeepStream (for the nvvllmvlm plugin).
  segments:
    image: vllm-ds-spike:latest
    profiles: ["segments"]
    runtime: nvidia
    network_mode: host
    privileged: true
    env_file: .env          # loads RTSP_URL_CAM*/OLLAMA_HOST literally (bash-source breaks on '&')
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
      CUDA_VISIBLE_DEVICES: "0"
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"        # model is cached; never hit the network
      HF_HUB_DISABLE_XET: "1"
      CHROMADB_HOST: "127.0.0.1"
      CHROMADB_PORT: "8000"
      SEGMENT_COLLECTION: "vision_segments"
      EMBED_MODEL: "nomic-embed-text"
    volumes:
      - .:/workspace
      - ../DeepStream/src/apps/reference_apps/deepstream-vllm-plugin:/home/vllm_ds_plugin
      - ./phase3-vllm-spike/hf_home:/root/.cache/huggingface
    working_dir: /workspace/segments
    # Reset the image's inherited `bash` entrypoint (it was committed from an
    # interactive container) so the command runs directly.
    entrypoint: ["python3"]
    command: ["segment_ingest.py", "--converter-mode", "gpu"]
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped